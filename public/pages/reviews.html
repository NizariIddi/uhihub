<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Course Reviews — UniHub Tanzania</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:.75rem;margin-bottom:1.5rem}
    .review-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:1.4rem;margin-bottom:1rem;transition:border-color .15s}
    .review-card:hover{border-color:rgba(201,150,12,.3)}
    .course-name{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--ink)}
    .course-meta{font-size:.78rem;color:var(--ink-muted);margin-top:.15rem}
    .rating-pills{display:flex;gap:.5rem;flex-wrap:wrap;margin:.75rem 0}
    .rpill{display:flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:.3rem .75rem;font-size:.78rem}
    .rpill-lbl{color:var(--ink-muted)}
    .rpill-val{font-weight:700;color:var(--gold)}
    .review-comment{font-size:.875rem;color:var(--ink);line-height:1.65;margin:.75rem 0;padding:.75rem 1rem;background:var(--surface);border-radius:6px;border-left:3px solid var(--gold)}
    [data-theme="dark"] .review-comment{background:#1C1A12}
    .reviewer{font-size:.75rem;color:var(--ink-muted)}
    .avg-bar{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:center}
    .avg-item{text-align:center;min-width:70px}
    .avg-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--gold);display:block}
    .avg-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
    .star-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem;gap:.75rem}
    .star-lbl{font-size:.83rem;color:var(--ink);width:120px;flex-shrink:0}
    .star-input{display:flex;gap:.2rem}
    .star-input span{font-size:1.6rem;cursor:pointer;color:#d1d5db;transition:color .1s;line-height:1}
    .star-input span.on,.star-input span:hover{color:#f59e0b}
    .star-val{font-size:.78rem;color:var(--ink-muted);width:70px;text-align:right;flex-shrink:0}
    .empty{text-align:center;padding:3rem;color:var(--ink-muted)}
    @media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.avg-bar{flex-direction:column;gap:1rem;align-items:center}}
    @media(max-width:480px){.filters{grid-template-columns:1fr!important}}
    @media(max-width:420px){.filters{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="topbarMount"></div>
<div class="layout">
  <div id="sidebarMount"></div>
  <main class="main">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem">
      <div><div class="label">Community</div><h1 class="page-title">Course Reviews</h1></div>
      <button class="btn btn-gold btn-sm" onclick="openWriteModal()">✍️ Write a review</button>
    </div>

    <div class="filters">
      <input class="input" type="text" id="fSearch" placeholder="🔍 Search by course name or code..."/>
      <select class="input" id="fUni"></select>
      <select class="input" id="fFac">
        <option value="">All faculties</option>
        <option value="engineering">Engineering</option>
        <option value="medicine">Medicine</option>
        <option value="law">Law</option>
        <option value="business">Business</option>
        <option value="science">Science</option>
        <option value="economics">Economics</option>
        <option value="arts">Arts</option>
      </select>
      <select class="input" id="fSort">
        <option value="recent">Most recent</option>
        <option value="highest">Highest rated</option>
        <option value="lowest">Lowest rated</option>
      </select>
    </div>

    <div id="avgBar" class="hidden avg-bar"></div>
    <div style="font-size:.82rem;color:var(--ink-muted);margin-bottom:1rem" id="rCount">Loading...</div>
    <div id="reviewsList">
      <div class="skeleton" style="height:160px;border-radius:10px;margin-bottom:1rem"></div>
      <div class="skeleton" style="height:160px;border-radius:10px"></div>
    </div>
  </main>
</div>

<!-- Write review modal -->
<div class="modal-overlay hidden" id="reviewModal">
  <div class="modal" style="max-width:540px;max-height:90vh;overflow-y:auto">
    <h2 class="modal-title">✍️ Write a course review</h2>
    <div id="revErr" class="alert alert-error hidden" style="margin-bottom:1rem"></div>
    <form id="revForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Course name *</label><input class="input" type="text" id="rCourseName" placeholder="e.g. Engineering Maths II" required/></div>
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Course code *</label><input class="input" type="text" id="rCourseCode" placeholder="e.g. EMA201" required/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">University *</label><select class="input" id="rUni" required></select></div>
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Semester / Year</label><input class="input" type="text" id="rSemester" placeholder="e.g. Sem 1, 2024"/></div>
      </div>
      <div style="margin-bottom:1.25rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Faculty / Department</label>
        <select class="input" id="rFaculty">
          <option value="">Select faculty (optional)</option>
          <option value="engineering">Engineering</option>
          <option value="medicine">Medicine</option>
          <option value="law">Law</option>
          <option value="business">Business</option>
          <option value="science">Science</option>
          <option value="economics">Economics</option>
          <option value="arts">Arts &amp; Social Sciences</option>
          <option value="agriculture">Agriculture</option>
        </select>
      </div>

      <div style="background:var(--surface);border-radius:8px;padding:1rem;margin-bottom:1rem;border:1px solid var(--border)">
        <div style="font-size:.85rem;font-weight:600;margin-bottom:.85rem">Your ratings <span style="color:var(--red)">*</span></div>
        <!-- Difficulty -->
        <div class="star-row">
          <span class="star-lbl">Difficulty</span>
          <div class="star-input" id="star-difficulty">
            <span onclick="setRating('difficulty',1)">★</span>
            <span onclick="setRating('difficulty',2)">★</span>
            <span onclick="setRating('difficulty',3)">★</span>
            <span onclick="setRating('difficulty',4)">★</span>
            <span onclick="setRating('difficulty',5)">★</span>
          </div>
          <span id="star-difficulty-label" class="star-val">Not rated</span>
        </div>
        <!-- Lecturer -->
        <div class="star-row">
          <span class="star-lbl">Lecturer quality</span>
          <div class="star-input" id="star-lecturer">
            <span onclick="setRating('lecturer',1)">★</span>
            <span onclick="setRating('lecturer',2)">★</span>
            <span onclick="setRating('lecturer',3)">★</span>
            <span onclick="setRating('lecturer',4)">★</span>
            <span onclick="setRating('lecturer',5)">★</span>
          </div>
          <span id="star-lecturer-label" class="star-val">Not rated</span>
        </div>
        <!-- Overall -->
        <div class="star-row">
          <span class="star-lbl">Overall</span>
          <div class="star-input" id="star-overall">
            <span onclick="setRating('overall',1)">★</span>
            <span onclick="setRating('overall',2)">★</span>
            <span onclick="setRating('overall',3)">★</span>
            <span onclick="setRating('overall',4)">★</span>
            <span onclick="setRating('overall',5)">★</span>
          </div>
          <span id="star-overall-label" class="star-val">Not rated</span>
        </div>
      </div>

      <div style="margin-bottom:1.5rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Comment <span style="font-weight:300;color:var(--ink-muted)">(optional but helpful!)</span></label>
        <textarea class="input" id="rComment" rows="3" placeholder="How was the workload? What would you tell a student taking this course?"></textarea>
      </div>
      <div style="display:flex;gap:.75rem">
        <button type="submit" class="btn btn-primary" style="flex:1" id="revSubmitBtn">Submit review</button>
        <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeWriteModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  let allReviews = [], searchTimer
  const ratings = { difficulty: 0, lecturer: 0, overall: 0 }
  const DIFF_LABELS  = ['','Very easy','Easy','Moderate','Hard','Very hard']
  const QUAL_LABELS  = ['','Poor','Fair','Good','Very good','Excellent']

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth(); renderLayout('reviews'); initSidebar()
    // IMPORTANT: set innerHTML BEFORE setting value
    document.getElementById('fUni').innerHTML = uniOptions('All universities')
    document.getElementById('rUni').innerHTML  = uniOptions('Select university *')
    const preUni = new URLSearchParams(location.search).get('uni') || getUser()?.university || ''
    if (preUni) document.getElementById('fUni').value = preUni

    await loadReviews()

    document.getElementById('fSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilters, 280) })
    document.getElementById('fUni').addEventListener('change', applyFilters)
    document.getElementById('fFac').addEventListener('change', applyFilters)
    document.getElementById('fSort').addEventListener('change', applyFilters)
  })

  async function loadReviews() {
    try {
      const d = await api.get('/api/reviews')
      allReviews = d.reviews || []
      renderAvg(d.avg)
      applyFilters()
    } catch(e) {
      document.getElementById('reviewsList').innerHTML = `<div class="empty"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div><p style="color:var(--red)">${esc(e.message)}</p></div>`
    }
  }

  function applyFilters() {
    const s    = document.getElementById('fSearch').value.toLowerCase().trim()
    const u    = document.getElementById('fUni').value
    const f    = document.getElementById('fFac').value
    const sort = document.getElementById('fSort').value
    let list = allReviews.filter(r =>
      (!s || r.courseName.toLowerCase().includes(s) || (r.courseCode||'').toLowerCase().includes(s)) &&
      (!u || r.university === u) &&
      (!f || (r.faculty||'').toLowerCase() === f)
    )
    if (sort === 'highest') list.sort((a,b) => b.overallRating - a.overallRating)
    else if (sort === 'lowest') list.sort((a,b) => a.overallRating - b.overallRating)
    renderReviews(list)
  }

  function renderAvg(avg) {
    const el = document.getElementById('avgBar')
    if (!avg || !allReviews.length) { el.classList.add('hidden'); return }
    el.classList.remove('hidden')
    el.innerHTML = `
      <div class="avg-item"><span class="avg-num">${avg.overallRating}</span><span class="avg-lbl">Overall</span></div>
      <div class="avg-item"><span class="avg-num">${avg.difficulty}</span><span class="avg-lbl">Difficulty</span></div>
      <div class="avg-item"><span class="avg-num">${avg.lecturerRating}</span><span class="avg-lbl">Lecturer</span></div>
      <div style="flex:1;min-width:180px">
        <div style="font-size:.8rem;color:var(--ink-muted);margin-bottom:.4rem">Based on ${allReviews.length} review${allReviews.length!==1?'s':''}</div>
        <div style="font-size:1.2rem">${stars(Math.round(avg.overallRating))}</div>
      </div>`
  }

  function renderReviews(list) {
    document.getElementById('rCount').textContent = `${list.length} review${list.length!==1?'s':''}`
    const el = document.getElementById('reviewsList')
    if (!list.length) {
      el.innerHTML = `<div class="empty"><div style="font-size:2.5rem;margin-bottom:1rem">📝</div><p style="font-weight:500">No reviews found.</p><button onclick="openWriteModal()" class="btn btn-gold" style="margin-top:1rem">Write the first review</button></div>`
      return
    }
    const me = getUser()
    el.innerHTML = list.map(r => `
      <div class="review-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.6rem">
          <div>
            <div class="course-name">${esc(r.courseName)}</div>
            <div class="course-meta">${esc(r.courseCode)} · ${esc((UNIS[r.university]||r.university||'').toUpperCase())}${r.semester?' · '+esc(r.semester):''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0">
            <div style="font-size:1.1rem">${stars(r.overallRating)}</div>
            ${r.userId===me?.id?`<button onclick="deleteReview('${r.id}')" class="del-btn">Delete</button>`:''}
          </div>
        </div>
        <div class="rating-pills">
          <div class="rpill"><span class="rpill-lbl">Difficulty</span><span class="rpill-val">${r.difficulty}/5</span><span style="font-size:.72rem;color:var(--ink-muted)">${DIFF_LABELS[r.difficulty]||''}</span></div>
          <div class="rpill"><span class="rpill-lbl">Lecturer</span><span class="rpill-val">${r.lecturerRating}/5</span><span style="font-size:.72rem;color:var(--ink-muted)">${QUAL_LABELS[r.lecturerRating]||''}</span></div>
          <div class="rpill"><span class="rpill-lbl">Overall</span><span class="rpill-val">${r.overallRating}/5</span><span style="font-size:.72rem;color:var(--ink-muted)">${QUAL_LABELS[r.overallRating]||''}</span></div>
        </div>
        ${r.comment?`<div class="review-comment">${esc(r.comment)}</div>`:''}
        <div class="reviewer">— ${r.author?esc(r.author.firstName+' '+r.author.lastName):'Anonymous'} · ${timeAgo(r.createdAt||r.created_at)}</div>
      </div>`).join('')
  }

  async function deleteReview(id) {
    if (!confirm('Delete your review?')) return
    try { await api.delete(`/api/reviews/${id}`); toast('Review deleted.'); await loadReviews() }
    catch(e) { toast(e.message,'error') }
  }

  function setRating(field, val) {
    ratings[field] = val
    document.querySelectorAll(`#star-${field} span`).forEach((s,i) => s.classList.toggle('on', i < val))
    const lbl = document.getElementById(`star-${field}-label`)
    lbl.textContent = field === 'difficulty' ? (DIFF_LABELS[val]||'') : (QUAL_LABELS[val]||'')
  }

  function openWriteModal()  { document.getElementById('reviewModal').classList.remove('hidden') }
  function closeWriteModal() { document.getElementById('reviewModal').classList.add('hidden') }

  document.getElementById('revForm').addEventListener('submit', async e => {
    e.preventDefault()
    const btn = document.getElementById('revSubmitBtn')
    const err = document.getElementById('revErr')
    err.classList.add('hidden')
    if (!ratings.difficulty || !ratings.lecturer || !ratings.overall) {
      err.textContent = 'Please rate all three categories before submitting.'
      err.classList.remove('hidden'); return
    }
    btn.disabled=true; btn.textContent='Submitting...'
    try {
      await api.post('/api/reviews', {
        courseName:    document.getElementById('rCourseName').value.trim(),
        courseCode:    document.getElementById('rCourseCode').value.trim().toUpperCase(),
        university:    document.getElementById('rUni').value,
        semester:      document.getElementById('rSemester').value.trim(),
        faculty:       document.getElementById('rFaculty')?.value || null,
        difficulty:    ratings.difficulty,
        lecturerRating:ratings.lecturer,
        overallRating: ratings.overall,
        comment:       document.getElementById('rComment').value.trim(),
      })
      toast('Review submitted! 🎉')
      closeWriteModal()
      document.getElementById('revForm').reset()
      ratings.difficulty = ratings.lecturer = ratings.overall = 0
      document.getElementById('rFaculty').value = ''
      ;['difficulty','lecturer','overall'].forEach(f => {
        document.querySelectorAll(`#star-${f} span`).forEach(s => s.classList.remove('on'))
        document.getElementById(`star-${f}-label`).textContent = 'Not rated'
      })
      await loadReviews()
    } catch(ex) { err.textContent = ex.message; err.classList.remove('hidden') }
    btn.disabled=false; btn.textContent='Submit review'
  })
</script>
</body>
</html>
