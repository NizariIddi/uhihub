<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Internships — UniHub Tanzania</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:.75rem;margin-bottom:1rem}
    .jobs{display:flex;flex-direction:column;gap:.75rem}
    .job-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1.4rem;display:flex;gap:1.25rem;transition:all .18s;cursor:default}
    .job-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,150,12,.12)}
    .job-logo{width:50px;height:50px;background:var(--gold-pale);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
    .job-body{flex:1;min-width:0}
    .job-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:.2rem;line-height:1.3}
    .job-company{font-size:.875rem;color:var(--ink);font-weight:500}
    .job-loc{font-size:.8rem;color:var(--ink-muted);margin-bottom:.6rem}
    .job-desc{font-size:.83rem;color:var(--ink-muted);line-height:1.55;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .job-tags{display:flex;gap:.4rem;flex-wrap:wrap}
    .job-action{display:flex;flex-direction:column;gap:.5rem;align-items:flex-end;flex-shrink:0}
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--ink-muted)}
    @media(max-width:768px){.filters{grid-template-columns:1fr 1fr!important}.job-card{flex-direction:column}.job-logo{width:42px;height:42px}.job-action{flex-direction:row;flex-wrap:wrap;width:100%}}
    @media(max-width:480px){.filters{grid-template-columns:1fr!important}.job-card{padding:1rem}.job-title{font-size:.93rem}}
  </style>
</head>
<body>
<div id="topbarMount"></div>
<div class="layout">
  <div id="sidebarMount"></div>
  <main class="main">
    <div class="page-header">
      <div class="label">Opportunities</div>
      <h1 class="page-title">Internships & Jobs</h1>
      <p style="color:var(--ink-muted);font-size:.875rem;margin-top:.25rem">Opportunities for Tanzanian university students.</p>
    </div>

    <div class="filters">
      <input class="input" type="text" id="fSearch" placeholder="🔍 Search by title, company or location..."/>
      <select class="input" id="fIndustry">
        <option value="">All industries</option>
        <option value="banking">Banking & Finance</option>
        <option value="government">Government</option>
        <option value="infrastructure">Infrastructure</option>
        <option value="telecommunications">Telecom</option>
        <option value="health">Health</option>
        <option value="education">Education</option>
        <option value="technology">Technology</option>
        <option value="other">Other</option>
      </select>
      <select class="input" id="fType">
        <option value="">All types</option>
        <option value="internship">Internship</option>
        <option value="graduate">Graduate trainee</option>
        <option value="part-time">Part-time</option>
      </select>
      <select class="input" id="fPaid">
        <option value="">Paid &amp; unpaid</option>
        <option value="paid">Paid only</option>
        <option value="unpaid">Unpaid only</option>
      </select>
    </div>

    <div style="font-size:.82rem;color:var(--ink-muted);margin-bottom:1rem" id="resultCount">Loading...</div>

    <div class="jobs" id="jobsList">
      <div class="skeleton" style="height:130px;border-radius:8px"></div>
      <div class="skeleton" style="height:130px;border-radius:8px"></div>
      <div class="skeleton" style="height:130px;border-radius:8px"></div>
    </div>
    <div class="pagination" id="jobsPagination"></div>
  </main>
</div>

<!-- Apply Modal -->
<div class="modal-overlay hidden" id="applyModal">
  <div class="modal" style="max-width:500px">
    <h2 class="modal-title" id="applyTitle">Apply</h2>
    <div id="applyErr" class="alert alert-error hidden" style="margin-bottom:1rem"></div>
    <div id="applyOk"  class="alert alert-success hidden" style="margin-bottom:1rem"></div>
    <div id="applyDetails" style="font-size:.875rem;color:var(--ink-muted);margin-bottom:1.25rem;padding:.75rem;background:var(--surface);border-radius:6px;border:1px solid var(--border)"></div>
    <div id="applyFormWrap">
      <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Cover letter <span style="font-weight:300;color:var(--ink-muted)">(optional)</span></label>
      <textarea class="input" id="coverLetter" rows="4" placeholder="Why are you a good fit for this role?"></textarea>
      <div style="display:flex;gap:.75rem;margin-top:1rem">
        <button class="btn btn-primary" style="flex:1" id="applyBtn" onclick="submitApp()">Submit application</button>
        <button class="btn btn-secondary" style="flex:1" onclick="closeApply()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  const JOBS_PER_PAGE = 10
  let allJobs = [], filteredJobs = [], jobsPage = 1
  let currentJobId = null
  let searchTimer = null

  const ICONS = { banking:'🏦', government:'🏛️', infrastructure:'🏗️', telecommunications:'📡', health:'🏥', education:'📚', technology:'💻', other:'💼' }

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth()
    renderLayout('internships')
    initSidebar()
    await loadJobs()
    document.getElementById('fSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { jobsPage=1; applyFilters() }, 280) })
    document.getElementById('fIndustry').addEventListener('change', () => { jobsPage=1; applyFilters() })
    document.getElementById('fType').addEventListener('change', () => { jobsPage=1; applyFilters() })
    document.getElementById('fPaid').addEventListener('change', () => { jobsPage=1; applyFilters() })
  })

  async function loadJobs() {
    try {
      const d = await api.get('/api/internships')
      allJobs = d.internships || []
      filteredJobs = allJobs
      renderJobsPage()
    } catch (e) {
      document.getElementById('jobsList').innerHTML = `<div class="empty-state"><p style="color:var(--red)">Failed to load: ${esc(e.message)}</p></div>`
    }
  }

  function applyFilters() {
    const s = document.getElementById('fSearch').value.toLowerCase().trim()
    const i = document.getElementById('fIndustry').value
    const t = document.getElementById('fType').value
    filteredJobs = allJobs.filter(j =>
      (!s || j.title.toLowerCase().includes(s) || j.company.toLowerCase().includes(s) || (j.location||'').toLowerCase().includes(s)) &&
      (!i || j.industry === i) && (!t || j.type === t)
    )
    renderJobsPage()
  }

  function renderJobsPage() {
    const total = filteredJobs.length
    const pages = Math.ceil(total / JOBS_PER_PAGE)
    if (jobsPage > pages && pages > 0) jobsPage = pages
    const start = (jobsPage - 1) * JOBS_PER_PAGE
    const page  = filteredJobs.slice(start, start + JOBS_PER_PAGE)

    document.getElementById('resultCount').textContent = `${total} opportunit${total !== 1 ? 'ies' : 'y'} found`
    const el = document.getElementById('jobsList')

    if (!total) {
      el.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem;margin-bottom:1rem">📭</div><p style="font-weight:500">No opportunities found.</p><p style="font-size:.85rem;margin-top:.5rem">Try different filters.</p></div>`
      document.getElementById('jobsPagination').innerHTML = ''
      return
    }

    el.innerHTML = page.map(j => {
      const icon = ICONS[j.industry] || '💼'
      const paidBadge = j.isPaid
        ? `<span class="badge badge-green">Paid${j.salary ? ' · ' + esc(j.salary) : ''}</span>`
        : `<span class="badge badge-red">Unpaid</span>`
      const emailBtn = j.contactEmail ? `<a href="mailto:${esc(j.contactEmail)}" class="btn btn-secondary btn-sm">Email HR</a>` : ''
      return `
        <div class="job-card">
          <div class="job-logo">${icon}</div>
          <div class="job-body">
            <div class="job-title">${esc(j.title)}</div>
            <div class="job-company">${esc(j.company)}</div>
            <div class="job-loc">📍 ${esc(j.location)}</div>
            <div class="job-desc">${esc(j.description)}</div>
            <div class="job-tags">
              <span class="badge badge-gold">${esc(j.type)}</span>
              ${paidBadge}
              <span class="badge" style="background:var(--badge-neutral-bg);color:var(--badge-neutral-fg)">${esc(j.industry)}</span>
            </div>
          </div>
          <div class="job-action">
            <button class="btn btn-primary btn-sm" onclick="openApply('${j.id}')">Apply now</button>
            ${emailBtn}
          </div>
        </div>`
    }).join('')

    renderPagination('jobsPagination', jobsPage, total, pages, 'goJobsPage')
  }

  function goJobsPage(p) { jobsPage = p; renderJobsPage(); document.getElementById('jobsList').scrollIntoView({behavior:'smooth',block:'start'}) }

  function getJob(id) { return allJobs.find(j => j.id === id) }

  function openApply(jobId) {
    const job = getJob(jobId)
    if (!job) return
    currentJobId = job.id
    document.getElementById('applyTitle').textContent = `Apply — ${job.title}`
    document.getElementById('applyErr').classList.add('hidden')
    document.getElementById('applyOk').classList.add('hidden')
    document.getElementById('applyFormWrap').classList.remove('hidden')
    document.getElementById('coverLetter').value = ''
    document.getElementById('applyDetails').innerHTML = `
      <strong>${esc(job.company)}</strong> · ${esc(job.location)}
      ${job.requirements ? `<div style="margin-top:.5rem;font-size:.82rem"><strong>Requirements:</strong> ${esc(job.requirements)}</div>` : ''}
    `
    document.getElementById('applyModal').classList.remove('hidden')
  }

  function closeApply() { document.getElementById('applyModal').classList.add('hidden'); currentJobId = null }

  async function submitApp() {
    if (!currentJobId) return
    const btn=document.getElementById('applyBtn'), err=document.getElementById('applyErr'), ok=document.getElementById('applyOk')
    err.classList.add('hidden'); btn.disabled=true; btn.textContent='Submitting...'
    try {
      await api.post(`/api/internships/${currentJobId}/apply`, { coverLetter: document.getElementById('coverLetter').value })
      ok.textContent = '✅ Application submitted! Good luck 🎉'
      ok.classList.remove('hidden')
      document.getElementById('applyFormWrap').classList.add('hidden')
    } catch(e) { err.textContent=e.message; err.classList.remove('hidden') }
    btn.disabled=false; btn.textContent='Submit application'
  }
</script>
</body>
</html>
