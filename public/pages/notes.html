<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Notes — UniHub Tanzania</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .main{padding:0;display:flex;flex-direction:column;overflow:hidden}
    .layout2{display:flex;flex:1;min-height:0;overflow:hidden}
    .content{flex:1;overflow-y:auto;padding:2rem 2.5rem;min-width:0}
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.75rem;margin-bottom:1rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:1rem}
    .ncard{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1.2rem;display:flex;flex-direction:column;transition:all .18s}
    .ncard:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,150,12,.13);transform:translateY(-2px)}
    .ncard.hl{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,150,12,.18)}
    .ntitle{font-family:'Playfair Display',serif;font-size:.97rem;font-weight:700;margin-bottom:.2rem;line-height:1.3}
    .ndesc{font-size:.8rem;color:var(--ink-muted);font-weight:300;line-height:1.55;flex:1;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .nmeta{font-size:.74rem;color:var(--ink-muted);margin-bottom:.5rem}
    .nfoot{display:flex;align-items:center;justify-content:space-between;padding-top:.7rem;border-top:1px solid var(--border);gap:.5rem}
    .nupl{font-size:.72rem;color:var(--ink-muted)}
    /* Explorer */
    .expl{width:272px;flex-shrink:0;background:var(--card-bg);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s}
    .expl.closed{width:0}
    .exhead{padding:.85rem 1rem .7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .exhead span{font-size:.82rem;font-weight:600}
    .exhead button{background:none;border:none;cursor:pointer;color:var(--ink-muted);font-size:1.1rem;border-radius:4px;padding:.1rem .3rem}
    .exhead button:hover{background:var(--gold-pale)}
    .exsearch{padding:.6rem .9rem;border-bottom:1px solid var(--border);flex-shrink:0}
    .exsearch input{width:100%;border:1px solid var(--border);border-radius:6px;padding:.42rem .75rem;font-size:.8rem;outline:none;font-family:inherit}
    .exsearch input:focus{border-color:var(--gold)}
    .exstats{padding:.42rem 1rem;border-bottom:1px solid var(--border);font-size:.71rem;color:var(--ink-muted);flex-shrink:0}
    .exlist{flex:1;overflow-y:auto}
    .exghdr{padding:.42rem 1rem .28rem;font-size:.67rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);background:var(--surface);position:sticky;top:0;border-bottom:1px solid var(--border)}
    .exitem{display:flex;align-items:flex-start;gap:.5rem;padding:.52rem 1rem;border-bottom:1px solid rgba(201,150,12,.06);cursor:pointer;transition:background .12s}
    .exitem:hover{background:var(--gold-pale)}
    .exitem.active{background:var(--gold-pale);}
    .exiname{font-size:.77rem;font-weight:500;line-height:1.3}
    .eximeta{font-size:.69rem;color:var(--ink-muted);margin-top:.1rem}
    .empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--ink-muted)}
    @media(max-width:900px){.filters{grid-template-columns:1fr}}
    @media(max-width:700px){.expl{position:fixed;right:0;top:0;bottom:0;z-index:50;width:280px!important;transform:translateX(100%);transition:transform .25s}.expl.mopen{transform:translateX(0)}.expl.closed{transform:translateX(100%)}}
  </style>
  <meta name="description" content="UniHub Tanzania — Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta name="keywords" content="UniHub, Tanzania, university notes, past exams, study resources, UDOM, ATC, academic platform" />
  <meta name="author" content="Neezar Iddi" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UniHub Tanzania" />
  <meta property="og:title" content="UniHub Tanzania — Study Smarter. Succeed Together." />
  <meta property="og:description" content="Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta property="og:url" content="https://unihub.neezar9i.site/" />
  <meta property="og:image" content="https://unihub.neezar9i.site/images/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UniHub Tanzania" />
  <meta name="twitter:description" content="Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta name="twitter:image" content="https://unihub.neezar9i.site/images/og-cover.png" />
</head>
<body>
<div id="topbarMount"></div>
<div class="layout">
  <div id="sidebarMount"></div>
  <main class="main">
    <div class="layout2">
      <div class="content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem">
          <div><div class="label">Marketplace</div><h1 class="page-title">Student Notes</h1></div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-secondary btn-sm" onclick="toggleEx()">📂 Explorer</button>
            <button class="btn btn-gold btn-sm" onclick="openModal()">+ Upload notes</button>
          </div>
        </div>

        <div class="filters" style="grid-template-columns:2fr 1fr 1fr 1fr;margin-bottom:.75rem">
          <input class="input" type="text" id="fSearch" placeholder="🔍 Search notes by title or course code..."/>
          <select class="input" id="fUni"></select>
          <select class="input" id="fFac">
            <option value="">All faculties</option>
            <option value="engineering">Engineering</option>
            <option value="medicine">Medicine</option>
            <option value="law">Law</option>
            <option value="business">Business</option>
            <option value="science">Science</option>
            <option value="agriculture">Agriculture</option>
            <option value="economics">Economics</option>
            <option value="arts">Arts &amp; Humanities</option>
            <option value="education">Education</option>
            <option value="ict">ICT / Computing</option>
          </select>
          <select class="input" id="fFileType">
            <option value="">All types</option>
            <option value="pdf">📄 PDF only</option>
            <option value="ppt">📊 PowerPoint only</option>
          </select>
        </div>

        <div style="font-size:.82rem;color:var(--ink-muted);margin-bottom:1rem" id="rCount">Loading...</div>
        <div class="grid" id="noteGrid">
          <div class="skeleton" style="height:200px;border-radius:8px"></div>
          <div class="skeleton" style="height:200px;border-radius:8px"></div>
          <div class="skeleton" style="height:200px;border-radius:8px"></div>
        </div>
        <div class="pagination" id="notesPagination"></div>
      </div>

      <div class="expl" id="exPanel">
        <div class="exhead"><span>📂 File Explorer</span><button onclick="toggleEx()">✕</button></div>
        <div class="exsearch"><input type="text" id="exSearch" placeholder="Quick find..." oninput="filterEx(this.value)"/></div>
        <div class="exstats" id="exStats">—</div>
        <div class="exlist" id="exList"><div style="padding:2rem;text-align:center;font-size:.82rem;color:var(--ink-muted)">Loading...</div></div>
      </div>
    </div>
  </main>
</div>

<!-- Upload modal -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <h2 class="modal-title">📝 Upload notes</h2>
    <p style="font-size:.85rem;color:var(--ink-muted);margin-bottom:1.25rem">Share PDF or PowerPoint notes — students can view them with AI assistance!</p>
    <div id="upErr" class="alert alert-error hidden" style="margin-bottom:1rem"></div>
    <form id="upForm">
      <div style="margin-bottom:1rem"><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Title *</label><input class="input" type="text" id="uTitle" placeholder="e.g. Engineering Maths II — Full Notes" required/></div>
      <div style="margin-bottom:1rem"><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Description</label><textarea class="input" id="uDesc" rows="2" placeholder="What topics are covered?"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">University *</label><select class="input" id="uUni" required onchange="onNoteUniChange()"></select></div>
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Course code</label><input class="input" type="text" id="uCode" placeholder="e.g. EMA201"/></div>
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Faculty / Department <span style="font-weight:300;color:var(--ink-muted)">(optional)</span></label>
        <input class="input" type="text" id="uFaculty" placeholder="e.g. Engineering, Medicine, Business"/>
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">College <span style="font-weight:300;color:var(--ink-muted)">(optional — helps link to module)</span></label>
        <select class="input" id="nCollege" onchange="onNoteCollegeChange()"><option value="">— Select college —</option></select>
      </div>
      <div style="margin-bottom:1rem" id="nFgProg" style="display:none">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Programme</label>
        <select class="input" id="nProg" onchange="onNoteProgChange()"><option value="">— Select programme —</option></select>
      </div>
      <div style="margin-bottom:1rem" id="nFgMod" style="display:none">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Module</label>
        <select class="input" id="nModule"><option value="">— Select module —</option></select>
      </div>
      <div style="margin-bottom:1.5rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">File * <span style="font-weight:300;color:var(--ink-muted)">(PDF or PowerPoint)</span></label>
        <input class="input" type="file" id="uFile" accept=".pdf,.ppt,.pptx,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" required style="padding:.5rem"/>
        <div style="font-size:.75rem;color:var(--ink-muted);margin-top:.3rem">PDF or PowerPoint (.pdf, .ppt, .pptx) · max 50MB</div>
      </div>
      <div id="upProgress" class="hidden" style="margin-bottom:1rem">
        <div style="background:var(--badge-neutral-bg);border-radius:4px;height:8px;overflow:hidden">
          <div id="upBar" style="height:100%;background:var(--gold);width:0%;transition:width .3s"></div>
        </div>
        <div style="font-size:.75rem;color:var(--ink-muted);margin-top:.3rem" id="upPct">0%</div>
      </div>
      <div style="display:flex;gap:.75rem">
        <button type="submit" class="btn btn-primary" style="flex:1" id="upBtn">Upload notes</button>
        <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  const NOTES_PER_PAGE = 12
  let all = [], filtered = [], notesPage = 1, exOpen = true, debT

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth(); renderLayout('notes'); initSidebar()
    document.getElementById('fUni').innerHTML = uniOptions('All universities')
    document.getElementById('uUni').innerHTML = uniOptions('Select university *')
    // Apply university pre-filter AFTER load so data is ready
    const _preUni = new URLSearchParams(location.search).get('uni') || getUser()?.university || ''
    await load()
    if (_preUni) { document.getElementById('fUni').value = _preUni; filter() }
    document.getElementById('fSearch').addEventListener('input', () => { clearTimeout(debT); debT = setTimeout(() => { notesPage=1; filter() }, 260) })
    document.getElementById('fUni').addEventListener('change', () => { notesPage=1; filter() })
    document.getElementById('fFac').addEventListener('change', () => { notesPage=1; filter() })
    document.getElementById('fFileType').addEventListener('change', () => { notesPage=1; filter() })
  })

  let bookmarkedIds = new Set()
  async function load() {
    try {
      const [d, bm] = await Promise.all([api.get('/api/notes'), api.get('/api/bookmarks/ids').catch(()=>({bookmarks:[]}))])
      all = d.notes || []
      bookmarkedIds = new Set((bm.bookmarks||[]).filter(b=>b.resourceType==='note').map(b=>b.resourceId))
      filter(); buildEx(all)
    } catch (e) {
      document.getElementById('rCount').textContent = 'Failed to load notes'
      document.getElementById('noteGrid').innerHTML = `<div class="empty"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div><p style="color:var(--red);font-weight:500">Could not load notes</p><p style="font-size:.82rem;color:var(--ink-muted);margin-top:.4rem">${esc(e.message)}</p><button onclick="load()" class="btn btn-secondary btn-sm" style="margin-top:1rem">Try again</button></div>`
    }
  }

  async function onNoteUniChange(){
    const uni=document.getElementById('uUni').value
    const col=document.getElementById('nCollege')
    col.innerHTML='<option value="">— Select college —</option>'
    document.getElementById('nFgProg').style.display=document.getElementById('nFgMod').style.display='none'
    if(!uni)return
    try{const d=await api.get('/api/hierarchy/colleges?university='+uni);(d.colleges||[]).forEach(c=>col.innerHTML+=`<option value="${c.id}">${c.name}</option>`)}catch{}
  }
  async function onNoteCollegeChange(){
    const cId=document.getElementById('nCollege').value,ps=document.getElementById('nProg')
    ps.innerHTML='<option value="">— Select programme —</option>'
    document.getElementById('nFgProg').style.display=document.getElementById('nFgMod').style.display='none'
    if(!cId)return
    try{const d=await api.get('/api/hierarchy/programmes?collegeId='+cId);(d.programmes||[]).forEach(p=>ps.innerHTML+=`<option value="${p.id}" data-dur="${p.duration||4}">${p.name}</option>`);document.getElementById('nFgProg').style.display='block'}catch{}
  }
  async function onNoteProgChange(){
    const pId=document.getElementById('nProg').value,ms=document.getElementById('nModule')
    const dur=parseInt(document.getElementById('nProg').options[document.getElementById('nProg').selectedIndex]?.dataset?.dur||'4')
    ms.innerHTML='<option value="">— Select module —</option>';document.getElementById('nFgMod').style.display='none'
    if(!pId)return
    try{
      const mods=[]
      for(let y=1;y<=dur;y++){const d=await api.get(`/api/hierarchy/modules?programmeId=${pId}&yearOfStudy=${y}`);(d.modules||[]).forEach(m=>mods.push({...m,y}))}
      const by={}; mods.forEach(m=>(by[m.yearOfStudy]=by[m.yearOfStudy]||[]).push(m))
      Object.entries(by).sort().forEach(([yr,arr])=>{const og=document.createElement('optgroup');og.label='Year '+yr;arr.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.code+' — '+m.name;og.appendChild(o)});ms.appendChild(og)})
      document.getElementById('nFgMod').style.display='block'
    }catch{}
  }
  async function bmNote(id, btn) { await toggleBookmark('note', id, btn); bookmarkedIds.has(id) ? bookmarkedIds.delete(id) : bookmarkedIds.add(id) }

  function filter() {
    const s  = document.getElementById('fSearch').value.toLowerCase()
    const u  = document.getElementById('fUni').value
    const f  = document.getElementById('fFac').value
    const ft = document.getElementById('fFileType').value
    filtered = all.filter(n =>
      (!s  || n.title.toLowerCase().includes(s) || (n.courseCode||'').toLowerCase().includes(s)) &&
      (!u  || n.university === u) &&
      (!f  || (n.faculty||'').toLowerCase() === f) &&
      (!ft || (n.fileType||'pdf') === ft)
    )
    renderPage()
  }

  function renderPage() {
    const total = filtered.length
    const pages = Math.ceil(total / NOTES_PER_PAGE)
    if (notesPage > pages && pages > 0) notesPage = pages
    const start = (notesPage - 1) * NOTES_PER_PAGE
    const page  = filtered.slice(start, start + NOTES_PER_PAGE)

    document.getElementById('rCount').textContent = `${total} note${total!==1?'s':''} found`
    const g = document.getElementById('noteGrid')

    if (!total) {
      g.innerHTML = `<div class="empty"><div style="font-size:2.5rem;margin-bottom:1rem">📭</div><p style="font-weight:500">No notes found.</p><p style="font-size:.85rem;margin-top:.5rem">Be the first to upload!</p><button onclick="openModal()" class="btn btn-gold" style="margin-top:1.25rem">Upload notes</button></div>`
      document.getElementById('notesPagination').innerHTML = ''
      return
    }

    g.innerHTML = page.map(n => `
      <div class="ncard" id="c-${n.id}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem">
          <span class="badge badge-gold">${esc((UNIS[n.university]||n.university||'').toUpperCase())}</span>
          <div style="display:flex;gap:.3rem;align-items:center">
            ${n.fileType==='ppt'?'<span class="badge" style="background:var(--badge-red-bg);color:var(--badge-red-fg);font-size:.68rem">📊 PPT</span>':'<span class="badge" style="background:var(--badge-blue-bg);color:var(--badge-blue-fg);font-size:.68rem">📄 PDF</span>'}
            <span class="badge" style="background:var(--badge-green-bg);color:var(--badge-green-fg);font-size:.7rem">Free</span>
          </div>
        </div>
        <div class="ntitle">${esc(n.title)}</div>
        <div class="nmeta">${[n.courseCode,n.faculty].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="ndesc">${esc(n.description||'No description provided.')}</div>
        ${n.isFeatured ? '<div style="margin-bottom:.4rem"><span style="font-size:.7rem;background:var(--badge-yellow-bg);color:var(--badge-yellow-fg);padding:.18rem .6rem;border-radius:20px;font-weight:600">⭐ Featured</span></div>' : ''}
        <div class="nfoot">
          <span class="nupl">👤 ${n.uploadedBy?esc(n.uploadedBy.firstName+' '+n.uploadedBy.lastName):'Anonymous'} · ⬇ ${n.downloadCount||0}</span>
          <div style="display:flex;gap:.35rem;flex-wrap:wrap">
            <a href="/pages/note-viewer.html?id=${n.id}" class="btn btn-secondary btn-sm">👁 View</a>
            <button onclick="dlNote('${n.id}')" class="btn btn-gold btn-sm">⬇</button>
            <button data-bookmarked="${bookmarkedIds.has(n.id)}" onclick="bmNote('${n.id}',this)" class="btn btn-secondary btn-sm" style="opacity:${bookmarkedIds.has(n.id)?1:.4}" title="Bookmark">🔖</button>
            <button onclick="openReportModal('note','${n.id}')" class="btn btn-secondary btn-sm" title="Report" style="font-size:.72rem">🚩</button>
          </div>
        </div>
      </div>`).join('')

    renderPagination('notesPagination', notesPage, total, pages, 'goNotesPage')
    const exQ = document.getElementById('exSearch')?.value || ''
    if (exQ) filterEx(exQ)
    else buildExList(filtered)
  }

  function goNotesPage(p) { notesPage = p; renderPage(); document.getElementById('noteGrid').scrollIntoView({behavior:'smooth',block:'start'}) }


  function dlNote(id)   { window.location.href = fileUrl(`/api/notes/${id}/download`) }

  function buildEx(list) {
    const unis = [...new Set(list.map(n=>n.university))].length
    const pdfs = list.filter(n=>n.fileType!=='ppt').length
    const ppts = list.filter(n=>n.fileType==='ppt').length
    document.getElementById('exStats').innerHTML = `<strong>${list.length}</strong> notes · <strong>${pdfs}</strong> PDF · <strong>${ppts}</strong> PPT`
    buildExList(list)
  }

  function buildExList(list) {
    const el = document.getElementById('exList')
    if (!list.length) { el.innerHTML = '<div style="padding:2rem;text-align:center;font-size:.82rem;color:var(--ink-muted)">No notes found</div>'; return }
    // Group by university then course code
    const byUni = {}
    list.forEach(n => { const k=UNIS[n.university]||n.university||'Other'; (byUni[k]=byUni[k]||[]).push(n) })
    el.innerHTML = Object.entries(byUni).sort(([a],[b])=>a.localeCompare(b)).map(([uni,items])=>`
      <div class="exghdr">🏛 ${esc(uni)} (${items.length})</div>
      ${items.map(n=>`
        <div class="exitem" id="x-${n.id}" onclick="hl('${n.id}')">
          <span style="font-size:.88rem;flex-shrink:0">${n.fileType==='ppt'?'📊':'📄'}</span>
          <div style="min-width:0">
            <div class="exiname">${esc(n.title)}</div>
            <div class="eximeta">${[n.courseCode,n.fileType==='ppt'?'PPT':'PDF'].filter(Boolean).join(' · ')}</div>
          </div>
        </div>`).join('')}`).join('')
  }

  function filterEx(q) { buildExList((filtered.length < all.length ? filtered : all).filter(n => n.title.toLowerCase().includes(q.toLowerCase()) || (n.courseCode||'').toLowerCase().includes(q.toLowerCase()))) }

  function hl(id) {
    document.querySelectorAll('.ncard.hl').forEach(c=>c.classList.remove('hl'))
    document.querySelectorAll('.exitem.active').forEach(i=>i.classList.remove('active'))
    const idx = filtered.findIndex(n=>n.id===id)
    if (idx !== -1) { const tp=Math.floor(idx/NOTES_PER_PAGE)+1; if(tp!==notesPage){notesPage=tp;renderPage()} }
    document.getElementById(`c-${id}`)?.classList.add('hl')
    document.getElementById(`x-${id}`)?.classList.add('active')
    document.getElementById(`c-${id}`)?.scrollIntoView({behavior:'smooth',block:'center'})
  }

  function toggleEx() { exOpen=!exOpen; document.getElementById('exPanel').classList.toggle('closed',!exOpen) }
  function openModal()  { document.getElementById('modal').classList.remove('hidden') }
  function closeModal() { document.getElementById('modal').classList.add('hidden') }

  document.getElementById('upForm').addEventListener('submit', async e => {
    e.preventDefault()
    const btn=document.getElementById('upBtn'), err=document.getElementById('upErr'), prog=document.getElementById('upProgress'), bar=document.getElementById('upBar'), pct=document.getElementById('upPct')
    err.classList.add('hidden')
    const file=document.getElementById('uFile').files[0]
    if (!file) { err.textContent='Please select a file.'; err.classList.remove('hidden'); return }
    const fname = file.name.toLowerCase()
    const ok = fname.endsWith('.pdf')||fname.endsWith('.ppt')||fname.endsWith('.pptx')||fname.endsWith('.pptm')
    if (!ok) { err.textContent='Only PDF or PowerPoint files (.pdf, .ppt, .pptx) are allowed.'; err.classList.remove('hidden'); return }
    if (file.size>50*1024*1024) { err.textContent='File too large (max 50MB).'; err.classList.remove('hidden'); return }
    btn.disabled=true; btn.textContent='Starting...'; prog.classList.remove('hidden')
    const fd=new FormData()
    fd.append('title',document.getElementById('uTitle').value.trim())
    fd.append('description',document.getElementById('uDesc').value.trim())
    fd.append('university',document.getElementById('uUni').value)
    fd.append('courseCode',document.getElementById('uCode').value.trim())
    fd.append('faculty',document.getElementById('uFaculty')?.value?.trim()||'')
    const nModId = document.getElementById('nModule')?.value
    if (nModId) fd.append('moduleId', nModId)
    fd.append('file',file)
    try {
      await api.upload('/api/notes',fd,p=>{ bar.style.width=p+'%'; pct.textContent=p<100?`Uploading ${p}%`:'Processing...'; btn.textContent=p<100?`Uploading ${p}%...`:'Processing...' })
      toast('Notes uploaded! 🎉'); closeModal(); document.getElementById('upForm').reset(); prog.classList.add('hidden'); bar.style.width='0%'; notesPage=1; await load()
    } catch(ex) { err.textContent=ex.message; err.classList.remove('hidden'); prog.classList.add('hidden') }
    btn.disabled=false; btn.textContent='Upload notes'
  })
</script>
</body>
</html>
