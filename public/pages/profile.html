<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profile — UniHub Tanzania</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .profile-header{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:2rem;margin-bottom:2rem;display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap}
    .avatar-big{width:80px;height:80px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:var(--ink);flex-shrink:0}
    .profile-name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;margin-bottom:.2rem}
    .profile-meta{font-size:.85rem;color:var(--ink-muted);margin-bottom:.75rem}
    .profile-bio{font-size:.875rem;color:var(--ink-muted);line-height:1.65;max-width:500px}
    .profile-stats{display:flex;gap:2rem;margin-top:1rem;flex-wrap:wrap}
    .pstat{text-align:center}
    .pstat-num{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--gold);display:block}
    .pstat-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-bottom:2rem}
    .mini-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1rem;display:flex;gap:.75rem;align-items:center;transition:all .15s}
    .mini-card:hover{border-color:var(--gold);transform:translateY(-2px)}
    .mini-icon{width:38px;height:38px;background:var(--gold-pale);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .mini-title{font-size:.85rem;font-weight:500;line-height:1.3}
    .mini-meta{font-size:.74rem;color:var(--ink-muted)}
    .section-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:1rem}
    .empty-sec{color:var(--ink-muted);font-size:.875rem;padding:1.5rem 0}
    /* Edit modal */
    .fg{margin-bottom:1rem}
    .fg label{display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem}
    @media(max-width:640px){
      .profile-header{flex-direction:column;padding:1.25rem;gap:1rem}
      .profile-stats{gap:1.25rem}
      .grid{grid-template-columns:1fr!important}
    }
  </style>
  <meta name="description" content="UniHub Tanzania — Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta name="keywords" content="UniHub, Tanzania, university notes, past exams, study resources, UDOM, ATC, academic platform" />
  <meta name="author" content="Neezar Iddi" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UniHub Tanzania" />
  <meta property="og:title" content="UniHub Tanzania — Study Smarter. Succeed Together." />
  <meta property="og:description" content="Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta property="og:url" content="https://unihub.neezar9i.site/" />
  <meta property="og:image" content="https://unihub.neezar9i.site/images/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UniHub Tanzania" />
  <meta name="twitter:description" content="Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta name="twitter:image" content="https://unihub.neezar9i.site/images/og-cover.png" />
</head>
<body>
<div id="topbarMount"></div>
<div class="layout">
  <div id="sidebarMount"></div>
  <main class="main">
    <div id="profileContent">
      <div class="skeleton" style="height:200px;border-radius:8px;margin-bottom:2rem"></div>
      <div class="skeleton" style="height:120px;border-radius:8px"></div>
    </div>
  </main>
</div>

<!-- Edit profile modal -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal" style="max-width:480px">
    <h2 class="modal-title">Edit profile</h2>
    <div id="editErr" class="alert alert-error hidden" style="margin-bottom:1rem"></div>
    <form id="editForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="fg"><label>First name</label><input class="input" type="text" id="eFn"/></div>
        <div class="fg"><label>Last name</label><input class="input" type="text" id="eLn"/></div>
      </div>
      <div class="fg"><label>Faculty / Department</label><input class="input" type="text" id="eFac" placeholder="e.g. Engineering"/></div>
      <div class="fg">
        <label>Year of study</label>
        <select class="input" id="eYear">
          <option value="">Select</option>
          <option value="1">Year 1</option><option value="2">Year 2</option>
          <option value="3">Year 3</option><option value="4">Year 4</option>
          <option value="5">Year 5</option><option value="6">Postgraduate</option>
        </select>
      </div>
      <div class="fg"><label>Bio</label><textarea class="input" id="eBio" rows="3" placeholder="Tell students a bit about yourself..."></textarea></div>
      <div style="border-top:1px solid var(--border);padding-top:1rem;margin-top:.5rem">
        <div style="font-size:.85rem;font-weight:600;margin-bottom:.75rem;color:var(--ink-muted)">Change password (optional)</div>
        <div class="fg"><label>Current password</label><input class="input" type="password" id="eCurPwd" placeholder="Leave blank to keep current"/></div>
        <div class="fg"><label>New password</label><input class="input" type="password" id="eNewPwd" placeholder="Min 6 characters"/></div>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:.5rem">
        <button type="submit" class="btn btn-primary" style="flex:1" id="editSaveBtn">Save changes</button>
        <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeEditModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  let profileData = null

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth(); renderLayout(''); initSidebar()
    const params = new URLSearchParams(window.location.search)
    const id = params.get('id') || getUser()?.id
    if (!id) { window.location.href='/pages/dashboard.html'; return }
    await loadProfile(id)
  })

  async function loadProfile(id) {
    try {
      const d = await api.get(`/api/profile/${id}`)
      profileData = d
      renderProfile(d)
    } catch(e) {
      document.getElementById('profileContent').innerHTML = `<div style="text-align:center;padding:4rem;color:var(--ink-muted)"><p style="color:var(--red)">${esc(e.message)}</p></div>`
    }
  }

  function renderProfile(d) {
    const { user, exams, notes, reviews } = d
    const me = getUser()
    const isMe = me?.id === user.id
    const ini = ((user.firstName?.[0]||'')+(user.lastName?.[0]||'')).toUpperCase()

    document.title = `${user.firstName} ${user.lastName} — UniHub`
    document.getElementById('profileContent').innerHTML = `
      <div class="profile-header">
        <div class="avatar-big">${ini}</div>
        <div style="flex:1">
          <div class="profile-name">${esc(user.firstName)} ${esc(user.lastName)}</div>
          <div class="profile-meta">
            ${esc((UNIS[user.university]||user.university||'').toUpperCase())}
            ${user.faculty?' · '+esc(user.faculty):''}
            ${user.yearOfStudy?' · Year '+user.yearOfStudy:''}
            ${user.isAdmin?' · <span class="badge badge-admin">Admin</span>':''}
          </div>
          ${user.bio ? `<div class="profile-bio">${esc(user.bio)}</div>` : '<div class="profile-bio" style="opacity:.5">No bio yet.</div>'}
          <div class="profile-stats">
            <div class="pstat"><span class="pstat-num">${exams.length}</span><span class="pstat-lbl">Exams shared</span></div>
            <div class="pstat"><span class="pstat-num">${notes.length}</span><span class="pstat-lbl">Notes shared</span></div>
            <div class="pstat"><span class="pstat-num">${reviews.length}</span><span class="pstat-lbl">Reviews</span></div>
          </div>
        </div>
        ${isMe ? `<button onclick="openEditModal()" class="btn btn-secondary btn-sm" style="flex-shrink:0">✏️ Edit profile</button>` : ''}
      </div>

      ${exams.length ? `
        <div class="section-title">📄 Shared exams</div>
        <div class="grid">${exams.map(e=>`
          <a href="/pages/exam-viewer.html?id=${e.id}" class="mini-card">
            <div class="mini-icon">📄</div>
            <div><div class="mini-title">${esc(e.courseName)}</div><div class="mini-meta">${esc((UNIS[e.university]||e.university||'').toUpperCase())} · ${e.year}</div></div>
          </a>`).join('')}
        </div>` : ''}

      ${notes.length ? `
        <div class="section-title">📝 Shared notes</div>
        <div class="grid">${notes.map(n=>`
          <div class="mini-card" style="cursor:pointer" onclick="window.open(fileUrl('/api/notes/${n.id}/file'),'_blank')">
            <div class="mini-icon">📝</div>
            <div><div class="mini-title">${esc(n.title)}</div><div class="mini-meta">${esc((UNIS[n.university]||n.university||'').toUpperCase())}${n.courseCode?' · '+esc(n.courseCode):''}</div></div>
          </div>`).join('')}
        </div>` : ''}

      ${!exams.length && !notes.length ? `<div class="empty-sec">No shared content yet.</div>` : ''}`
  }

  function openEditModal() {
    if (!profileData) return
    const u = profileData.user
    document.getElementById('eFn').value   = u.firstName||''
    document.getElementById('eLn').value   = u.lastName||''
    document.getElementById('eFac').value  = u.faculty||''
    document.getElementById('eYear').value = u.yearOfStudy||''
    document.getElementById('eBio').value  = u.bio||''
    document.getElementById('eCurPwd').value = ''
    document.getElementById('eNewPwd').value = ''
    document.getElementById('editErr').classList.add('hidden')
    document.getElementById('editModal').classList.remove('hidden')
  }
  function closeEditModal() { document.getElementById('editModal').classList.add('hidden') }

  document.getElementById('editForm').addEventListener('submit', async e => {
    e.preventDefault()
    const btn = document.getElementById('editSaveBtn')
    const err = document.getElementById('editErr')
    err.classList.add('hidden'); btn.disabled=true; btn.textContent='Saving...'
    try {
      const updated = await api.put('/api/profile/me', {
        firstName: document.getElementById('eFn').value,
        lastName:  document.getElementById('eLn').value,
        faculty:   document.getElementById('eFac').value,
        yearOfStudy: document.getElementById('eYear').value || null,
        bio:       document.getElementById('eBio').value,
      })
      // Update localStorage user
      const cur = getUser()
      localStorage.setItem('user', JSON.stringify({ ...cur, ...updated }))

      // Change password if filled
      const curPwd = document.getElementById('eCurPwd').value
      const newPwd = document.getElementById('eNewPwd').value
      if (curPwd && newPwd) {
        await api.put('/api/profile/me/password', { currentPassword: curPwd, newPassword: newPwd })
        toast('Password changed!')
      }
      toast('Profile updated!')
      closeEditModal()
      await loadProfile(getUser().id)
    } catch(ex) { err.textContent=ex.message; err.classList.remove('hidden') }
    btn.disabled=false; btn.textContent='Save changes'
  })
</script>
</body>
</html>
