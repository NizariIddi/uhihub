<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Course Catalogue — UniHub Tanzania</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .cat-layout{display:flex;gap:1.5rem;align-items:flex-start}
    /* Sidebar filters */
    .cat-side{width:220px;flex-shrink:0;position:sticky;top:1rem}
    .cat-side h3{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);margin-bottom:.6rem}
    .uni-list{list-style:none}
    .uni-item{padding:.48rem .75rem;border-radius:6px;cursor:pointer;font-size:.875rem;color:var(--ink-muted);transition:all .12s;margin-bottom:.15rem;border:1px solid transparent}
    .uni-item:hover{background:var(--gold-pale);color:var(--ink)}
    .uni-item.active{background:var(--gold-pale);color:var(--ink);border-color:rgba(201,150,12,.3);font-weight:500}
    /* Course grid */
    .cat-main{flex:1;min-width:0}
    .fac-section{margin-bottom:2rem}
    .fac-hdr{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:.6rem}
    .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem}
    .course-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1rem;cursor:pointer;transition:all .18s;text-decoration:none;display:block;color:inherit}
    .course-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 12px rgba(201,150,12,.1)}
    .cc-code{font-size:.7rem;font-weight:700;background:var(--gold-pale);color:var(--gold);padding:.18rem .55rem;border-radius:20px;display:inline-block;margin-bottom:.4rem}
    .cc-name{font-size:.9rem;font-weight:600;line-height:1.35;margin-bottom:.3rem}
    .cc-meta{font-size:.74rem;color:var(--ink-muted)}
    .cc-stats{display:flex;gap:.6rem;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border)}
    .cc-stat{font-size:.7rem;color:var(--ink-muted)}
    .empty{text-align:center;padding:4rem 2rem;color:var(--ink-muted)}
    @media(max-width:768px){.cat-layout{flex-direction:column}.cat-side{width:100%;position:static}}
  </style>
  <meta name="description" content="UniHub Tanzania — Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta name="keywords" content="UniHub, Tanzania, university notes, past exams, study resources, UDOM, ATC, academic platform" />
  <meta name="author" content="Neezar Iddi" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UniHub Tanzania" />
  <meta property="og:title" content="UniHub Tanzania — Study Smarter. Succeed Together." />
  <meta property="og:description" content="Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta property="og:url" content="https://unihub.neezar9i.site/" />
  <meta property="og:image" content="https://unihub.neezar9i.site/images/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UniHub Tanzania" />
  <meta name="twitter:description" content="Share notes, past exams, and academic resources with students across Tanzanian universities." />
  <meta name="twitter:image" content="https://unihub.neezar9i.site/images/og-cover.png" />
</head>
<body>
<div id="topbarMount"></div>
<div class="layout">
  <div id="sidebarMount"></div>
  <main class="main">
    <div class="page-header">
      <div class="label">Explore</div>
      <h1 class="page-title">Course Catalogue</h1>
      <p style="color:var(--ink-muted);font-size:.875rem;margin-top:.25rem">Browse all courses across Tanzanian universities.</p>
    </div>

    <div style="margin-bottom:1.5rem">
      <input class="input" type="text" id="fSearch" placeholder="🔍 Search by course name or code..." style="max-width:500px"/>
    </div>

    <div class="cat-layout">
      <!-- University sidebar -->
      <div class="cat-side">
        <h3>University</h3>
        <ul class="uni-list" id="uniList"></ul>
      </div>

      <!-- Courses -->
      <div class="cat-main" id="catalogueMain">
        <div class="skeleton" style="height:200px;border-radius:8px;margin-bottom:1.5rem"></div>
        <div class="skeleton" style="height:200px;border-radius:8px"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/utils.js"></script>
<script>
  let allCourses = [], selectedUni = '', searchTimer

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth(); renderLayout('catalogue'); initSidebar()
    const preUni = getUser()?.university || ''
    if (preUni) selectedUni = preUni
    await loadCourses()
    document.getElementById('fSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderCatalogue,260) })
  })

  async function loadCourses() {
    try {
      const d = await api.get('/api/courses?limit=200')
      allCourses = d.courses || []
      buildUniList()
      renderCatalogue()
    } catch(e) {
      document.getElementById('catalogueMain').innerHTML = `<div class="empty"><p style="color:var(--red)">${esc(e.message)}</p></div>`
    }
  }

  function buildUniList() {
    const unis = [...new Set(allCourses.map(c => c.university))].sort()
    const el   = document.getElementById('uniList')
    el.innerHTML = `<li class="uni-item ${!selectedUni?'active':''}" onclick="selectUni('')">All universities</li>` +
      unis.map(u => `<li class="uni-item ${selectedUni===u?'active':''}" onclick="selectUni('${u}')">${esc(UNIS[u]||u.toUpperCase())}</li>`).join('')
  }

  function selectUni(uni) {
    selectedUni = uni
    buildUniList()
    renderCatalogue()
  }

  function renderCatalogue() {
    const q   = document.getElementById('fSearch').value.toLowerCase().trim()
    const el  = document.getElementById('catalogueMain')

    let list = allCourses.filter(c =>
      (!selectedUni || c.university === selectedUni) &&
      (!q || c.courseName.toLowerCase().includes(q) || c.courseCode.toLowerCase().includes(q))
    )

    if (!list.length) {
      el.innerHTML = `<div class="empty"><div style="font-size:2.5rem;margin-bottom:1rem">📚</div><p>No courses found.</p></div>`
      return
    }

    // Group by faculty
    const byFac = {}
    list.forEach(c => { (byFac[c.faculty]=byFac[c.faculty]||[]).push(c) })
    const FAC_ICONS = { engineering:'⚙️', science:'🔬', law:'⚖️', business:'💼', medicine:'🏥', nursing:'💉', agriculture:'🌾', economics:'📊', architecture:'🏗️', planning:'🗺️' }

    el.innerHTML = Object.entries(byFac).sort(([a],[b])=>a.localeCompare(b)).map(([fac,courses]) => `
      <div class="fac-section">
        <div class="fac-hdr">${FAC_ICONS[fac]||'📖'} ${esc(fac.charAt(0).toUpperCase()+fac.slice(1))} <span style="font-size:.8rem;color:var(--ink-muted);font-family:'DM Sans',sans-serif;font-weight:400">(${courses.length})</span></div>
        <div class="course-grid">
          ${courses.map(c => `
            <a href="/pages/course.html?id=${c.id}" class="course-card">
              <span class="cc-code">${esc(c.courseCode)}</span>
              <div class="cc-name">${esc(c.courseName)}</div>
              <div class="cc-meta">${esc((UNIS[c.university]||c.university||'').toUpperCase())}${c.year?' · '+esc(c.year):''}${c.credits?' · '+c.credits+' credits':''}</div>
            </a>`).join('')}
        </div>
      </div>`).join('')
  }
</script>
</body>
</html>
