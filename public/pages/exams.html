<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Past Exams — UniHub Tanzania</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .main{padding:0;display:flex;flex-direction:column;overflow:hidden}
    .layout2{display:flex;flex:1;min-height:0;overflow:hidden}
    .content{flex:1;overflow-y:auto;padding:2rem 2.5rem;min-width:0}
    .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:.75rem;margin-bottom:1rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:1rem}
    .ecard{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1.2rem;transition:all .18s}
    .ecard:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,150,12,.13);transform:translateY(-2px)}
    .ecard.hl{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,150,12,.18)}
    .etop{display:flex;justify-content:space-between;margin-bottom:.6rem}
    .eyear{font-size:.71rem;font-weight:600;background:var(--gold-pale);color:var(--gold);padding:.18rem .6rem;border-radius:20px}
    .euni{font-size:.71rem;color:var(--ink-muted);background:var(--badge-neutral-bg);padding:.18rem .6rem;border-radius:20px}
    .etitle{font-family:'Playfair Display',serif;font-size:.97rem;font-weight:700;margin-bottom:.2rem;line-height:1.3}
    .emeta{font-size:.75rem;color:var(--ink-muted);margin-bottom:.75rem}
    .estats{display:flex;gap:.75rem;margin-bottom:.75rem}
    .estats span{font-size:.71rem;color:var(--ink-muted)}
    .efoot{display:flex;gap:.5rem;padding-top:.75rem;border-top:1px solid var(--border)}
    .efoot .btn{flex:1;text-align:center;font-size:.78rem;padding:.45rem}
    /* Explorer */
    .expl{width:272px;flex-shrink:0;background:var(--card-bg);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s}
    .expl.closed{width:0}
    .exhead{padding:.85rem 1rem .7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .exhead span{font-size:.82rem;font-weight:600}
    .exhead button{background:none;border:none;cursor:pointer;color:var(--ink-muted);font-size:1.1rem;border-radius:4px;padding:.1rem .3rem}
    .exhead button:hover{background:var(--gold-pale)}
    .exsearch{padding:.6rem .9rem;border-bottom:1px solid var(--border);flex-shrink:0}
    .exsearch input{width:100%;border:1px solid var(--border);border-radius:6px;padding:.42rem .75rem;font-size:.8rem;outline:none;font-family:inherit}
    .exsearch input:focus{border-color:var(--gold)}
    .exstats{padding:.42rem 1rem;border-bottom:1px solid var(--border);font-size:.71rem;color:var(--ink-muted);flex-shrink:0}
    .exlist{flex:1;overflow-y:auto}
    .exghdr{padding:.42rem 1rem .28rem;font-size:.67rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);background:var(--surface);position:sticky;top:0;border-bottom:1px solid var(--border)}
    .exitem{display:flex;align-items:flex-start;gap:.5rem;padding:.52rem 1rem;border-bottom:1px solid rgba(201,150,12,.06);cursor:pointer;transition:background .12s}
    .exitem:hover{background:var(--gold-pale)}
    .exitem.active{background:var(--gold-pale);}
    .exiname{font-size:.77rem;font-weight:500;line-height:1.3}
    .eximeta{font-size:.69rem;color:var(--ink-muted);margin-top:.1rem}
    .empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--ink-muted)}
    .skel{height:175px;border-radius:8px}
    @media(max-width:1050px){.filters{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.filters{grid-template-columns:1fr}.expl{position:fixed;right:0;top:0;bottom:0;z-index:50;width:280px!important;transform:translateX(100%);transition:transform .25s;box-shadow:-4px 0 20px rgba(0,0,0,.1)}.expl.mopen{transform:translateX(0)}.expl.closed{transform:translateX(100%)}}
  </style>
</head>
<body>
<div id="topbarMount"></div>
<div class="layout">
  <div id="sidebarMount"></div>
  <main class="main">
    <div class="layout2">
      <div class="content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem">
          <div><div class="label">Library</div><h1 class="page-title">Past Exams</h1></div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" onclick="toggleEx()">📂 Explorer</button>
            <button class="btn btn-gold btn-sm" onclick="openModal()">+ Upload exam</button>
          </div>
        </div>

        <div class="filters" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr">
          <input class="input" type="text" id="fSearch" placeholder="🔍 Search by course name or code..."/>
          <select class="input" id="fUni"></select>
          <select class="input" id="fYear">
            <option value="">All years</option>
            <option>2024</option><option>2023</option><option>2022</option>
            <option>2021</option><option>2020</option><option>2019</option>
          </select>
          <select class="input" id="fFac">
            <option value="">All faculties</option>
            <option value="engineering">Engineering</option><option value="medicine">Medicine</option>
            <option value="law">Law</option><option value="business">Business</option>
            <option value="science">Science</option><option value="agriculture">Agriculture</option>
            <option value="economics">Economics</option><option value="arts">Arts</option>
          </select>
          <select class="input" id="fType">
            <option value="">All types</option>
            <option value="UE">University Exam (UE)</option>
            <option value="CAT">Test / CAT</option>
            <option value="supp">Supplementary</option>
            <option value="mock">Mock / Practise</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">
          <span style="font-size:.82rem;color:var(--ink-muted)" id="rCount">Loading...</span>
          <button id="zipBtn" class="btn btn-secondary btn-sm hidden" onclick="downloadZip()">⬇ Download filtered as ZIP</button>
        </div>
        <div class="grid" id="examGrid">
          <div class="skeleton skel"></div><div class="skeleton skel"></div>
          <div class="skeleton skel"></div><div class="skeleton skel"></div>
        </div>
        <div class="pagination" id="examPagination"></div>
      </div>

      <div class="expl" id="exPanel">
        <div class="exhead">
          <span>📂 File Explorer</span>
          <button onclick="toggleEx()">✕</button>
        </div>
        <div class="exsearch"><input type="text" id="exSearch" placeholder="Quick find..." oninput="filterEx(this.value)"/></div>
        <div class="exstats" id="exStats">—</div>
        <div class="exlist" id="exList"><div class="exitem" style="justify-content:center;color:var(--ink-muted);font-size:.82rem">Loading...</div></div>
      </div>
    </div>
  </main>
</div>

<!-- Upload modal -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <h2 class="modal-title">📤 Upload exam paper</h2>
    <p style="font-size:.85rem;color:var(--ink-muted);margin-bottom:1.25rem">Share past exam PDFs to help fellow students. PDF only, max 25MB.</p>
    <div id="upErr" class="alert alert-error hidden" style="margin-bottom:1rem"></div>
    <form id="upForm">
      <div style="margin-bottom:1rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Course name *</label>
        <input class="input" type="text" id="uName" placeholder="e.g. Engineering Mathematics II" required/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Course code</label><input class="input" type="text" id="uCode" placeholder="e.g. EMA201"/></div>
        <div>
          <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Year *</label>
          <select class="input" id="uYear" required>
            <option value="">Select</option>
            <option>2024</option><option>2023</option><option>2022</option>
            <option>2021</option><option>2020</option><option>2019</option>
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">University *</label><select class="input" id="uUni" required onchange="onUploadUniChange()"></select></div>
        <div><label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Faculty</label><input class="input" type="text" id="uFac" placeholder="e.g. Engineering"/></div>
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Exam type *</label>
        <select class="input" id="uExamType">
          <option value="UE">📋 University Exam (UE) — Final/Semester exam</option>
          <option value="CAT">✏️ Test / CAT — Continuous Assessment Test</option>
          <option value="supp">🔁 Supplementary — Resit/Repeat exam</option>
          <option value="mock">🧪 Mock / Practise exam</option>
          <option value="other">📄 Other</option>
        </select>
      </div>
      <div style="margin-bottom:1rem" id="fgModUni">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">Link to module <span style="font-weight:300;color:var(--ink-muted)">(optional)</span></label>
        <select class="input" id="uCollege" onchange="onUploadCollegeChange()"><option value="">— Select college (optional) —</option></select>
      </div>
      <div style="margin-bottom:1rem" id="fgModProg" style="display:none">
        <select class="input" id="uProg" onchange="onUploadProgChange()"><option value="">— Select programme —</option></select>
      </div>
      <div style="margin-bottom:1rem" id="fgModSel" style="display:none">
        <select class="input" id="uModule"><option value="">— Select module —</option></select>
      </div>
      <div style="margin-bottom:1.5rem">
        <label style="display:block;font-size:.85rem;font-weight:500;margin-bottom:.4rem">PDF file *</label>
        <input class="input" type="file" id="uFile" accept=".pdf,application/pdf" required style="padding:.5rem"/>
        <div style="font-size:.75rem;color:var(--ink-muted);margin-top:.3rem">PDF only · max 25MB</div>
      </div>
      <div id="upProgress" class="hidden" style="margin-bottom:1rem">
        <div style="background:var(--badge-neutral-bg);border-radius:4px;height:8px;overflow:hidden">
          <div id="upBar" style="height:100%;background:var(--gold);width:0%;transition:width .3s"></div>
        </div>
        <div style="font-size:.75rem;color:var(--ink-muted);margin-top:.3rem" id="upPct">0%</div>
      </div>
      <div style="display:flex;gap:.75rem">
        <button type="submit" class="btn btn-primary" style="flex:1" id="upBtn">Upload paper</button>
        <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
  const PAGE_SIZE = 12
  let all = [], filtered = [], currentPage = 1, exOpen = true, debT

  document.addEventListener('DOMContentLoaded', async () => {
    requireAuth(); renderLayout('exams'); initSidebar()
    document.getElementById('fUni').innerHTML = uniOptions('All universities')
    document.getElementById('uUni').innerHTML = uniOptions('Select university *')
    // Pre-select user's university (from URL param or profile)
    const urlUni = new URLSearchParams(location.search).get('uni')
    const user = getUser()
    const preUni = urlUni || user?.university || ''
    if (preUni) {
      document.getElementById('fUni').value = preUni
    }
    await load()
    document.getElementById('fSearch').addEventListener('input', () => { clearTimeout(debT); debT = setTimeout(() => { currentPage=1; filter() }, 260) })
    document.getElementById('fUni').addEventListener('change', () => { currentPage=1; filter() })
    document.getElementById('fYear').addEventListener('change', () => { currentPage=1; filter() })
    document.getElementById('fFac').addEventListener('change', () => { currentPage=1; filter() })
    document.getElementById('fType').addEventListener('change', () => { currentPage=1; filter() })
  })

  let bookmarkedIds = new Set()
  async function load() {
    try {
      const [d, bm] = await Promise.all([api.get('/api/exams'), api.get('/api/bookmarks/ids').catch(()=>({bookmarks:[]}))])
      all = d.exams || []
      bookmarkedIds = new Set((bm.bookmarks||[]).filter(b=>b.resourceType==='exam').map(b=>b.resourceId))
      filter(); buildEx(all)
    } catch (e) {
      document.getElementById('rCount').textContent = 'Failed to load exams'
      document.getElementById('examGrid').innerHTML = `<div class="empty"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div><p style="color:var(--red);font-weight:500">Could not load exams</p><p style="font-size:.82rem;color:var(--ink-muted);margin-top:.4rem">${esc(e.message)}</p><button onclick="load()" class="btn btn-secondary btn-sm" style="margin-top:1rem">Try again</button></div>`
    }
  }

  async function bm(type, id, btn) { await toggleBookmark(type, id, btn); bookmarkedIds.has(id) ? bookmarkedIds.delete(id) : bookmarkedIds.add(id) }

  function filter() {
    const s = document.getElementById('fSearch').value.toLowerCase()
    const u = document.getElementById('fUni').value
    const y = document.getElementById('fYear').value
    const f = document.getElementById('fFac').value
    const t = document.getElementById('fType').value
    filtered = all.filter(e =>
      (!s || e.courseName.toLowerCase().includes(s) || (e.courseCode||'').toLowerCase().includes(s)) &&
      (!u || e.university === u) && (!y || String(e.year) === y) && (!f || e.faculty === f) &&
      (!t || (e.examType||'UE') === t)
    )
    renderPage()
  }

  function renderPage() {
    const total = filtered.length
    const pages = Math.ceil(total / PAGE_SIZE)
    if (currentPage > pages && pages > 0) currentPage = pages
    const start = (currentPage - 1) * PAGE_SIZE
    const page  = filtered.slice(start, start + PAGE_SIZE)

    document.getElementById('rCount').textContent = `${total} exam${total!==1?'s':''} found`
    const g = document.getElementById('examGrid')
    if (!total) { g.innerHTML = '<div class="empty"><div style="font-size:2.5rem;margin-bottom:1rem">📭</div><p>No exams found. Try different filters or upload one!</p></div>'; document.getElementById('examPagination').innerHTML=''; return }

    g.innerHTML = page.map(e => `
      <div class="ecard" id="c-${e.id}">
        <div class="etop">
          <span class="eyear">${e.year}</span>
          <span class="euni">${esc((UNIS[e.university]||e.university||'').toUpperCase())}</span>
        </div>
        <div style="margin-bottom:.5rem">
          ${{'UE':'<span style="font-size:.68rem;background:#e0f2fe;color:#0369a1;padding:.15rem .55rem;border-radius:20px;font-weight:600">📋 University Exam</span>','CAT':'<span style="font-size:.68rem;background:#f0fdf4;color:#166534;padding:.15rem .55rem;border-radius:20px;font-weight:600">✏️ Test / CAT</span>','supp':'<span style="font-size:.68rem;background:#fff7ed;color:#c2410c;padding:.15rem .55rem;border-radius:20px;font-weight:600">🔁 Supplementary</span>','mock':'<span style="font-size:.68rem;background:#faf5ff;color:#7e22ce;padding:.15rem .55rem;border-radius:20px;font-weight:600">🧪 Mock</span>'}[e.examType||'UE']||'<span style="font-size:.68rem;background:var(--badge-neutral-bg);color:var(--badge-neutral-fg);padding:.15rem .55rem;border-radius:20px;font-weight:600">📄 Exam</span>'}
        </div>
        ${e.isFeatured ? '<div style="margin-bottom:.4rem"><span style="font-size:.7rem;background:var(--badge-yellow-bg);color:var(--badge-yellow-fg);padding:.18rem .6rem;border-radius:20px;font-weight:600">⭐ Featured</span></div>' : ''}
        <div class="etitle">${esc(e.courseName)}</div>
        <div class="emeta">${[e.courseCode,e.faculty].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="estats"><span>👁 ${e.viewCount||0}</span><span>⬇ ${e.downloadCount||0}</span></div>
        <div class="efoot">
          <a href="/pages/exam-viewer.html?id=${e.id}" class="btn btn-primary">📖 View</a>
          <button onclick="dl('${e.id}')" class="btn btn-secondary">⬇</button>
          <button data-bookmarked="${bookmarkedIds.has(e.id)}" onclick="bm('exam','${e.id}',this)" class="btn btn-secondary" style="opacity:${bookmarkedIds.has(e.id)?1:.4}" title="${bookmarkedIds.has(e.id)?'Remove bookmark':'Bookmark'}">🔖</button>
          <button onclick="openReportModal('exam','${e.id}')" class="btn btn-secondary" title="Report" style="font-size:.75rem;padding:.45rem .5rem">🚩</button>
        </div>
      </div>`).join('')

    renderPagination('examPagination', currentPage, total, pages, 'goPage')
    // Keep explorer in sync with active filters
    const exQ = document.getElementById('exSearch')?.value || ''
    if (exQ) filterEx(exQ)
    else buildExList(filtered)
  }

  function goPage(p) { currentPage = p; renderPage(); document.getElementById('examGrid').scrollIntoView({behavior:'smooth',block:'start'}) }

  function buildEx(list) {
    const unis = [...new Set(list.map(e=>e.university))].length
    const types = [...new Set(list.map(e=>e.examType||'UE'))].length
    document.getElementById('exStats').innerHTML = `<strong>${list.length}</strong> exams · <strong>${unis}</strong> unis`
    buildExList(list)
  }

  const TYPE_ICON = { UE:'📋', CAT:'✏️', supp:'🔁', mock:'🧪', other:'📄' }
  const TYPE_NAME = { UE:'University Exams', CAT:'Tests / CATs', supp:'Supplementary', mock:'Mock Exams', other:'Other' }

  function buildExList(list) {
    const el = document.getElementById('exList')
    if (!list.length) { el.innerHTML = '<div style="padding:2rem;text-align:center;font-size:.82rem;color:var(--ink-muted)">No exams found</div>'; return }
    // Group by type → university
    const byType = {}
    list.forEach(e => { const t=e.examType||'UE'; (byType[t]=byType[t]||[]).push(e) })
    const typeOrder = ['UE','CAT','supp','mock','other']
    el.innerHTML = typeOrder.filter(t=>byType[t]).map(t => {
      const items = byType[t]
      const byUni = {}
      items.forEach(e => { const k=UNIS[e.university]||e.university||'Other'; (byUni[k]=byUni[k]||[]).push(e) })
      return `
        <div class="exghdr">${TYPE_ICON[t]||'📄'} ${TYPE_NAME[t]||t} (${items.length})</div>
        ${Object.entries(byUni).sort(([a],[b])=>a.localeCompare(b)).map(([uni,exams])=>`
          <div style="padding:.2rem .9rem .1rem 1rem;font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);background:var(--surface);border-bottom:1px solid var(--border)">${esc(uni)}</div>
          ${exams.sort((a,b)=>b.year-a.year).map(e=>`
            <div class="exitem" id="x-${e.id}" onclick="hl('${e.id}')">
              <span style="font-size:.82rem;flex-shrink:0">${TYPE_ICON[e.examType||'UE']||'📄'}</span>
              <div style="min-width:0"><div class="exiname">${esc(e.courseName)}</div><div class="eximeta">${[e.courseCode,String(e.year)].filter(Boolean).join(' · ')}</div></div>
            </div>`).join('')}`).join('')}`
    }).join('')
  }

  function filterEx(q) { buildExList((filtered.length < all.length ? filtered : all).filter(e => e.courseName.toLowerCase().includes(q.toLowerCase()) || (e.courseCode||'').toLowerCase().includes(q.toLowerCase()))) }

  function hl(id) {
    document.querySelectorAll('.ecard.hl').forEach(c=>c.classList.remove('hl'))
    document.querySelectorAll('.exitem.active').forEach(i=>i.classList.remove('active'))
    const card = document.getElementById(`c-${id}`)
    // Card may be on a different page — find it and navigate
    const idx = filtered.findIndex(e=>e.id===id)
    if (idx !== -1) {
      const targetPage = Math.floor(idx/PAGE_SIZE)+1
      if (targetPage !== currentPage) { currentPage=targetPage; renderPage() }
    }
    document.getElementById(`c-${id}`)?.classList.add('hl')
    document.getElementById(`x-${id}`)?.classList.add('active')
    document.getElementById(`c-${id}`)?.scrollIntoView({behavior:'smooth',block:'center'})
  }

  function toggleEx() { exOpen=!exOpen; document.getElementById('exPanel').classList.toggle('closed',!exOpen) }
  function dl(id) { window.location.href = fileUrl(`/api/exams/${id}/download`) }

  function downloadZip() {
    const zFiltered = all.filter(e => {
      const s=document.getElementById('fSearch').value.toLowerCase(), u=document.getElementById('fUni').value, y=document.getElementById('fYear').value, f=document.getElementById('fFac').value
      return (!s||e.courseName.toLowerCase().includes(s)||(e.courseCode||'').toLowerCase().includes(s))&&(!u||e.university===u)&&(!y||String(e.year)===y)&&(!f||e.faculty===f)
    })
    if (!zFiltered.length) { toast('No exams to download','error'); return }
    const codes = [...new Set(zFiltered.map(e=>e.courseCode).filter(Boolean))]
    if (codes.length > 1) { toast('ZIP works best for a single course code. Filter by course code first.','error'); return }
    const code=codes[0]||zFiltered[0].courseCode, uni=document.getElementById('fUni').value||zFiltered[0]?.university
    const a=document.createElement('a'); a.href=fileUrl(`/api/download/exams?courseCode=${encodeURIComponent(code)}&university=${uni}`); a.download=''; a.click()
    toast(`Downloading ${zFiltered.length} exams as ZIP...`)
  }

  function openModal()  { document.getElementById('modal').classList.remove('hidden') }
  function closeModal() { document.getElementById('modal').classList.add('hidden') }

  async function onUploadUniChange() {
    const uni = document.getElementById('uUni').value
    const colSel = document.getElementById('uCollege')
    document.getElementById('fgModProg').style.display = document.getElementById('fgModSel').style.display = 'none'
    colSel.innerHTML = '<option value="">— Select college (optional) —</option>'
    if (!uni) return
    try {
      const d = await api.get('/api/hierarchy/colleges?university='+uni)
      ;(d.colleges||[]).forEach(c => colSel.innerHTML += `<option value="${c.id}">${c.name}</option>`)
    } catch {}
  }
  async function onUploadCollegeChange() {
    const cId = document.getElementById('uCollege').value
    const progSel = document.getElementById('uProg')
    document.getElementById('fgModProg').style.display = document.getElementById('fgModSel').style.display = 'none'
    progSel.innerHTML = '<option value="">— Select programme —</option>'
    if (!cId) return
    try {
      const d = await api.get('/api/hierarchy/programmes?collegeId='+cId)
      ;(d.programmes||[]).forEach(p => progSel.innerHTML += `<option value="${p.id}" data-dur="${p.duration||4}">${p.name}</option>`)
      document.getElementById('fgModProg').style.display = 'block'
    } catch {}
  }
  async function onUploadProgChange() {
    const pId = document.getElementById('uProg').value
    const modSel = document.getElementById('uModule')
    const dur = parseInt(document.getElementById('uProg').options[document.getElementById('uProg').selectedIndex]?.dataset?.dur||'4')
    modSel.innerHTML = '<option value="">— Select module —</option>'
    document.getElementById('fgModSel').style.display = 'none'
    if (!pId) return
    try {
      const mods = []
      for (let y=1;y<=dur;y++) {
        const d = await api.get(`/api/hierarchy/modules?programmeId=${pId}&yearOfStudy=${y}`)
        ;(d.modules||[]).forEach(m => mods.push({...m,y}))
      }
      const byYear = {}
      mods.forEach(m => (byYear[m.yearOfStudy]=byYear[m.yearOfStudy]||[]).push(m))
      Object.entries(byYear).sort().forEach(([yr,ms]) => {
        const og = document.createElement('optgroup');og.label=`Year ${yr}`
        ms.forEach(m => { const o=document.createElement('option');o.value=m.id;o.textContent=`${m.code} — ${m.name}`;og.appendChild(o) })
        modSel.appendChild(og)
      })
      document.getElementById('fgModSel').style.display = 'block'
    } catch {}
  }

  document.getElementById('upForm').addEventListener('submit', async e => {
    e.preventDefault()
    const btn=document.getElementById('upBtn'), err=document.getElementById('upErr'), prog=document.getElementById('upProgress'), bar=document.getElementById('upBar'), pct=document.getElementById('upPct')
    err.classList.add('hidden')
    const file=document.getElementById('uFile').files[0]
    if (!file) { err.textContent='Please select a PDF file.'; err.classList.remove('hidden'); return }
    if (!file.name.toLowerCase().endsWith('.pdf')) { err.textContent='Only PDF files are allowed.'; err.classList.remove('hidden'); return }
    if (file.size>25*1024*1024) { err.textContent='File too large (max 25MB).'; err.classList.remove('hidden'); return }
    btn.disabled=true; btn.textContent='Starting...'; prog.classList.remove('hidden')
    const fd=new FormData()
    fd.append('courseName',document.getElementById('uName').value.trim())
    fd.append('courseCode',document.getElementById('uCode').value.trim())
    fd.append('year',document.getElementById('uYear').value)
    fd.append('university',document.getElementById('uUni').value)
    fd.append('faculty',document.getElementById('uFac').value.trim())
    fd.append('examType',document.getElementById('uExamType')?.value||'UE')
    const modId = document.getElementById('uModule')?.value
    if (modId) fd.append('moduleId', modId)
    fd.append('file',file)
    try {
      await api.upload('/api/exams',fd,p=>{ bar.style.width=p+'%'; pct.textContent=p<100?`Uploading ${p}%`:'Processing...'; btn.textContent=p<100?`Uploading ${p}%...`:'Processing...' })
      toast('Exam uploaded! 🎉'); closeModal(); document.getElementById('upForm').reset(); prog.classList.add('hidden'); bar.style.width='0%'; await load()
    } catch(ex) { err.textContent=ex.message; err.classList.remove('hidden'); prog.classList.add('hidden') }
    btn.disabled=false; btn.textContent='Upload paper'
  })
</script>
</body>
